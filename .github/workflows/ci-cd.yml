name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: HTML validate
        run: npx --yes html-validate@8 index.html
      - name: Check for leftover placeholders (warning only)
        run: grep -n "USERNAME" index.html robots.txt sitemap.xml || true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy config scan (Dockerfile / IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: Docker build & image scan
    runs-on: ubuntu-latest
    needs: [validate, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t portfolio:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name web -p 8080:8080 portfolio:${{ github.sha }}
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "DevOps Engineer"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: mkdir _site && cp index.html robots.txt sitemap.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    name: Production health check
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check site responds
        run: |
          URL="${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/', github.repository_owner) }}"
          for i in $(seq 1 10); do
            if curl -fsS "$URL" | grep -q "DevOps Engineer"; then echo "OK: $URL"; exit 0; fi
            sleep 10
          done
          echo "Health check failed: $URL"; exit 1
